[package]
name = "derivator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
bip0039 = "0.14"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.189"
orchard = { package = "zakura-orchard", git = "https://github.com/auzum197/zakura-common", rev = "a4551d88767de37fa139c71a343eaa1e027b5f5c", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
rpassword = "7"
sapling-crypto = { package = "zakura-sapling-crypto", git = "https://github.com/auzum197/zakura-common", rev = "a4551d88767de37fa139c71a343eaa1e027b5f5c" }
secrecy = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zcash_address = { package = "zakura-address", git = "https://github.com/auzum197/zakura-common", rev = "a4551d88767de37fa139c71a343eaa1e027b5f5c" }
zcash_keys = { package = "zakura-keys", git = "https://github.com/auzum197/zakura-common", rev = "a4551d88767de37fa139c71a343eaa1e027b5f5c", features = ["orchard", "sapling", "transparent-inputs", "transparent-key-encoding"] }
zcash_protocol = { package = "zakura-protocol", git = "https://github.com/auzum197/zakura-common", rev = "a4551d88767de37fa139c71a343eaa1e027b5f5c" }
zcash_transparent = { package = "zakura-transparent", git = "https://github.com/auzum197/zakura-common", rev = "a4551d88767de37fa139c71a343eaa1e027b5f5c", default-features = false }
zeroize = "1"
zip32 = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

# Unoptimised Argon2 and the Zcash proving primitives dominate the test suite.
# Our own code stays unoptimised so debugging still works.
[profile.dev.package."*"]
opt-level = 2
